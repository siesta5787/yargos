Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
    Option "DontZap" "true"
EndSection

Section "Device"
    Identifier "amd"
    Driver "amdgpu"
    Option "TearFree" "true"
    Option "VariableRefresh" "false"
EndSection

kernel.printk = 0 0 0 0
vm.swappiness = 10
# The system runs from a USB stick: a big pile of unwritten data (installing YARG writes ~500 MB) would keep the stick
# busy for minutes and everything else, the dashboard included, would wait behind it. Keep the backlog small.
vm.dirty_background_bytes = 8388608
vm.dirty_bytes = 33554432

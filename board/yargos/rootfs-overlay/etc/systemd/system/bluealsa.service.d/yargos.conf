[Service]
# Only play to a headset (A2DP source). The package's default also offers this computer as a speaker (a sink) to phones.
# --keep-alive: YARG opens and closes the sound output several times while it starts; without this every close stops the
# headset's audio stream and every open starts it again (some earbuds then stop answering and the link drops). It must outlast
# the gap between the dashboard's silent test of the headset and the game's own audio start.
# --a2dp-force-audio-cd: offer 44.1 kHz only, so every stream is set up at 44.1 kHz: a program that asks for 48 kHz otherwise makes
# bluealsa renegotiate the codec on the live stream (BlueZ closes and reopens it), and the earbuds stopped answering that
# (a 25 s hang in the game's audio start, then the link dropped, the Wii guitars with it). asound.conf also pins the format.
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source --a2dp-force-audio-cd --keep-alive=30

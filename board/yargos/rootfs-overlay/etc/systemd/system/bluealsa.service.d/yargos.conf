[Service]
# Only play to a headset (A2DP source). The package's default also offers this computer as a speaker (a sink) to phones.
# --keep-alive: YARG opens and closes the sound output several times while it starts; without this every close stops the
# headset's audio stream and every open starts it again (some earbuds then stop answering and the link drops).
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source --keep-alive=10

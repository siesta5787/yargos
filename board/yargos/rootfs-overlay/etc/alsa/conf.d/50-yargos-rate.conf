# When a program's sample rate is not one the sound card does (44.1 kHz music on a USB card that only does 48 kHz is
# the usual case), ALSA converts it. Its built-in converter is crude and audibly harsh (a clean 10 kHz tone gains a
# false tone only 23 dB below it); libsamplerate's best sinc converter is clean.
defaults.pcm.rate_converter "samplerate_best"

image efi-part.vfat {
	vfat {
		file EFI/BOOT/BOOTX64.EFI { image = "systemd-bootx64.efi" }
		file bzImage { image = "bzImage" }
		file loader/loader.conf { image = "esp/loader/loader.conf" }
		file loader/entries/yargos.conf { image = "esp/loader/entries/yargos.conf" }
		file loader/entries/yargos-debug.conf { image = "esp/loader/entries/yargos-debug.conf" }
	}
	size = 256M
}

image data.ext4 {
	ext4 {
		label = "YARGDATA"
		use-mke2fs = true
	}
	size = 2G
}

image yargos.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	partition rootfs {
		image = "rootfs.ext4"
		partition-type-uuid = L
		partition-uuid = 6d5a1c52-0d4e-4c5b-9a3f-7e3b8a1f0001
	}

	partition data {
		image = "data.ext4"
		partition-type-uuid = L
	}
}
